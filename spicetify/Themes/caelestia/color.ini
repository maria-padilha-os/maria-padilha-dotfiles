; Maria Padilha Spicetify fallback palette.
;
; padilha-dots copies this file only when
; ~/.config/spicetify/Themes/caelestia/color.ini does not exist.
; padilha-theme owns the installed copy after the first apply and renders it
; from maria-padilha-de/share/templates/spicetify-dark.ini or
; spicetify-light.ini. Run `spicetify apply` after a palette change.

[caelestia]
text                = e5e1e9                  ; Main text colour
subtext             = c8c5d0                  ; Subtext colour
main                = 201f25                  ; Main field background
highlight           = 424178                  ; Hover background; text stays readable on it
misc                = c8c5d0                  ; Miscellaneous text
notification        = 2a292f                  ; Notification toast
notification-error  = 93000a                  ; Error toast; text pairs with onSurface
shadow              = 000000                  ; Shadow for covers, context menu, also affects playlist/artist banners
card                = 2a292f                  ; Context menu and tooltips
player              = 464559                  ; Player and top-result background
sidebar             = 131318                  ; Sidebar background
main-elevated       = 2a292f                  ; Higher layers than main, e.g. search bar
highlight-elevated  = 35343a                  ; Home button and search bar accelerator
selected-row        = e5e1e9                  ; Selected song, scrollbar and caption text
equalizer           = c7c4dd                  ; Equalizer bars
button              = c3c0ff                  ; Playlist/play button accent
button-active       = c3c0ff                  ; Active play button accent
button-disabled     = 928f9a                  ; Seekbar and volume bar background
tab-active          = 2a292f                  ; Tabbar active item background
accent              = c3c0ff                  ; Accent used by newer Spicetify builds
