; Maria Padilha Spicetify fallback palette.
;
; padilha-dots copies this file only when
; ~/.config/spicetify/Themes/caelestia/color.ini does not exist.
; padilha-theme owns the installed copy after the first apply and renders it
; from maria-padilha-de/share/templates/spicetify-dark.ini or
; spicetify-light.ini. Run `spicetify apply` after a palette change.

[caelestia]
text                = 191d17                  ; Main text colour
subtext             = 43483f                  ; Subtext colour
main                = f8fbf1                  ; Main field background
highlight           = c0efb0                  ; Hover background; text stays readable on it
misc                = 43483f                  ; Miscellaneous text
notification        = e6e9e0                  ; Notification toast
notification-error  = ffdad6                  ; Error toast; text pairs with onSurface
shadow              = 000000                  ; Shadow for covers, context menu, also affects playlist/artist banners
card                = ecefe5                  ; Context menu and tooltips
player              = d7e8cd                  ; Player and top-result background
sidebar             = ecefe5                  ; Sidebar background
main-elevated       = e6e9e0                  ; Higher layers than main, e.g. search bar
highlight-elevated  = e1e4da                  ; Home button and search bar accelerator
selected-row        = 191d17                  ; Selected song, scrollbar and caption text
equalizer           = 54634d                  ; Equalizer bars
button              = 406836                  ; Playlist/play button accent
button-active       = 406836                  ; Active play button accent
button-disabled     = 5a6056                  ; Seekbar and volume bar background
tab-active          = ecefe5                  ; Tabbar active item background
accent              = 406836                  ; Accent used by newer Spicetify builds
