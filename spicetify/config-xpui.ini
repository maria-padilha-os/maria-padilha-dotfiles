; Maria Padilha Spicetify fallback settings.
;
; padilha-dots copies this file only when ~/.config/spicetify/config-xpui.ini
; does not exist. Spicetify rewrites its own config, so this file is never
; symlinked. The palette itself is written by padilha-theme to
; Themes/caelestia/color.ini; this file only selects that theme.
;
; Spotify and Spicetify are optional. This repository does not install,
; bundle or patch either of them. After a palette change run:
;   spicetify apply

[Setting]
current_theme          = caelestia
color_scheme           = caelestia
inject_css             = 1
inject_theme_js        = 1
replace_colors         = 1
overwrite_assets       = 0
check_spicetify_update = 0
spotify_launch_flags   =
spotify_path           =
prefs_path             =
always_enable_devtools = 0

[Preprocesses]
disable_sentry     = 1
disable_ui_logging = 1
remove_rtl_rule    = 1
expose_apis        = 1

[AdditionalOptions]
extensions            =
custom_apps           =
sidebar_config        = 0
home_config           = 1
experimental_features = 1
