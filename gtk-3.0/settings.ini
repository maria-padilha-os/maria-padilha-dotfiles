# Maria Padilha GTK 3 settings for Thunar, file choosers, dialogs, menus and
# the other GTK 3 applications.
#
# GTK 4 reads the matching gtk-4.0/settings.ini. The colours themselves live in
# the generated gtk.css and thunar.css in each directory. They are written by
# padilha-theme in maria-padilha-de and must not be copied into this checkout
# or edited here. padilha-dots links only the settings.ini files, so the
# generated CSS stays a local file.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
