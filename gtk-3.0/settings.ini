# Maria Padilha GTK 3 settings for Thunar and the other GTK applications.
#
# The colours themselves live in the generated gtk.css and thunar.css in this
# directory. They are written by padilha-theme in maria-padilha-de and must not
# be copied into this checkout or edited here. padilha-dots links only this
# settings.ini, so the generated CSS stays a local file.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
