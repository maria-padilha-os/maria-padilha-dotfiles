# Padilha idle policy.
#
# The shell lock screen crashed Quickshell on 2026-11-04 (the PAM subprocess
# exited and the shell process disappeared). Until the lock surface is fixed,
# idle only powers the panel down; do not call `qs ... lock` from hypridle.
# Manual Super+Escape still requests the shell lock, and the watchdog restarts
# the shell if that path is activated again.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms()'
    on-resume = hyprctl dispatch 'hl.dsp.dpms()'
}
