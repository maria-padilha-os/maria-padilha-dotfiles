# Padilha idle policy: lock the shell's own lock screen after five minutes,
# then power the panel down five minutes later. Both commands run inside the
# Hyprland session, where WAYLAND_DISPLAY and HYPRLAND_INSTANCE_SIGNATURE are set.
general {
    lock_cmd = qs -c caelestia ipc call lock lock
    before_sleep_cmd = qs -c caelestia ipc call lock lock
}

listener {
    timeout = 300
    on-timeout = qs -c caelestia ipc call lock lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms()'
    on-resume = hyprctl dispatch 'hl.dsp.dpms()'
}
