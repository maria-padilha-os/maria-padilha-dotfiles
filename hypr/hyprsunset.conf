# Night-light schedule for hyprsunset. The last profile whose time has passed
# applies for the rest of the day; times use the local 24h clock.
#
# Tune the temperatures to taste: lower is warmer, 6500 is neutral.
max-gamma = 100

profile {
    time = 6:00
    identity = true
}

profile {
    time = 18:00
    temperature = 5000
}

profile {
    time = 21:00
    temperature = 4000
}
