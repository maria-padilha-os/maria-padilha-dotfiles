# Maria Padilha GTK 4 settings for non-libadwaita GTK applications.
#
# The colours themselves live in the generated gtk-4.0/gtk.css and
# gtk-4.0/thunar.css in this directory. They are written by padilha-theme in
# maria-padilha-de and must not be copied into this checkout or edited here.
# padilha-dots links only this settings.ini, so the generated CSS stays a local
# file.
#
# GTK 4 reads this file for dialogs, menus and file choosers. Libadwaita
# applications ignore gtk-theme-name and use their own stylesheet; see
# ../flatpak/README.md.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
