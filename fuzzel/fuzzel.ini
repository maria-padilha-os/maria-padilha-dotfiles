# Maria Padilha fuzzel fallback configuration.
#
# padilha-dots copies this file only when ~/.config/fuzzel/fuzzel.ini does not
# exist. padilha-theme owns the installed copy after the first apply and renders
# it from maria-padilha-de/share/templates/fuzzel.ini. Fuzzel reads the file on
# launch, so a palette change takes effect the next time the launcher opens.

font=JetBrains Mono NF:size=17
terminal=wezterm start --
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[border]
radius=10
width=2

[colors]
# Opaque colours keep the launcher readable over any wallpaper; fuzzel blends
# translucent values with whatever window is behind it.
background=f8fbf1ff
text=191d17ff
prompt=406836ff
placeholder=5a6056ff
input=191d17ff
match=386568ff
selection=c0efb0ff
selection-text=002200ff
selection-match=386568ff
counter=5a6056ff
border=5a6056ff
